name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

# Autolabeler inspects each PR's title so you don't have to manually
# label every PR. Write PR titles like:
#   feat: add support for X        -> labeled "minor"
#   fix: correct Y calculation     -> labeled "patch"
#   breaking: change config format -> labeled "major"
autolabeler:
  - label: "major"
    title:
      - "/^breaking(\\(.*\\))?!?:/i"
      - "/^feat(\\(.*\\))?!:/i"
    body:
      - "/BREAKING CHANGE/i"
  - label: "minor"
    title:
      - "/^feat(\\(.*\\))?:/i"
  - label: "patch"
    title:
      - "/^fix(\\(.*\\))?:/i"
      - "/^perf(\\(.*\\))?:/i"
  - label: "documentation"
    title:
      - "/^docs(\\(.*\\))?:/i"
  - label: "chore"
    title:
      - "/^chore(\\(.*\\))?:/i"
      - "/^ci(\\(.*\\))?:/i"
      - "/^refactor(\\(.*\\))?:/i"
      - "/^test(\\(.*\\))?:/i"

# Unified categorization + version-bump rules (current schema).
# Each category's "when" filters which PRs land in it by label;
# "type: version-resolver" entries (no title) don't create a section
# in the changelog, they only decide the semver bump.
categories:
  - title: "🚨 Breaking Changes"
    when:
      labels:
        - "major"
        - "breaking"

  - title: "🚀 Features"
    when:
      labels:
        - "minor"
        - "feature"
        - "enhancement"

  - title: "🐛 Bug Fixes"
    when:
      labels:
        - "patch"
        - "fix"
        - "bugfix"
        - "bug"

  - title: "🧰 Maintenance"
    when:
      labels:
        - "chore"
        - "dependencies"
        - "ci"
        - "github-actions"
        - "docker"
        - "python"

  - title: "📚 Documentation"
    when:
      labels:
        - "documentation"
        - "docs"

  - type: "pre-exclude"
    when:
      label: "skip-changelog"

  - type: "version-resolver"
    semver-increment: "major"
    when:
      labels:
        - "major"
        - "breaking"

  - type: "version-resolver"
    semver-increment: "minor"
    when:
      labels:
        - "minor"
        - "feature"
        - "enhancement"

  - type: "version-resolver"
    semver-increment: "patch"
    when:
      labels:
        - "patch"
        - "fix"
        - "bugfix"
        - "bug"
        - "chore"
        - "dependencies"
        - "documentation"

  - type: "version-resolver"
    semver-increment: "patch"

template: |
  ## Changes

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
 