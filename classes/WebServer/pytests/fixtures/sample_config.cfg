# Sample config.cfg for pytest fixtures
# Mirrors a minimal real-world PPG configuration

[general]
read_mode = sequential

[logging]
log_dir = logs
log_file = PPG.log
level = DEBUG
rotation = weekly
when = W0
interval = 1
backup_count = 4
console = true

[transport.Inverter1]
transport = modbus_tcp
protocol_version = eg4_18kpv
host = 10.17.2.65
port = 502
serial_number = 4066670074
read_interval = 15
bridge = transport.timescaledb
manufacturer = EG4
model = 18KPV
name = EG4 18kpv1
write = false

[transport.Battery2]
transport = modbus_eg4_ll_s_tcp
protocol_version = eg4_ll_s
host = 10.17.2.66
port = 502
slave_id = 2
read_interval = 15
bridge = transport.timescaledb
manufacturer = EG4
model = ll_s
name = EG4 ll_s Battery 2
write = false

[transport.timescaledb]
transport = timescaledb
host = 10.17.2.42
port = 5431
database = solar1
username = TestUser
password = TestPass

[transport.mqtt]
transport = mqtt
host = 10.17.2.42
port = 1883
user = TestUser
pass = TestPass
base_topic = inverter_test
discovery_enabled = true
