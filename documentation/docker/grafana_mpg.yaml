# =============================================================================
# Grafana Datasource Provisioning
# Place this file at: config/grafana/provisioning/datasources/grafana_mpg.yaml
#
# Grafana will automatically register both data sources on first boot.
# Variables are resolved from the Grafana container's environment.
# =============================================================================
apiVersion: 1

datasources:

  - name: TimescaleDB
    type: postgres
    url: "${GF_TIMESCALE_HOST}:${GF_TIMESCALE_PORT}"
    database: "${GF_TIMESCALE_DB}"
    user: "${GF_TIMESCALE_USER}"
    secureJsonData:
      password: "${GF_TIMESCALE_PASSWORD}"
    jsonData:
      sslmode: disable
      timescaledb: true
      postgresVersion: 1600
    isDefault: true
    editable: false

  - name: InfluxDB
    type: influxdb
    url: "${GF_INFLUX_URL}"
    database: "${GF_INFLUX_DB}"
    user: "${GF_INFLUX_USER}"
    secureJsonData:
      password: "${GF_INFLUX_PASSWORD}"
    jsonData:
      httpMode: GET
    isDefault: false
    editable: false
