name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "🚨 Breaking Changes"
    labels:
      - "major"
      - "breaking"
  - title: "🚀 Features"
    labels:
      - "minor"
      - "feature"
      - "enhancement"
  - title: "🐛 Bug Fixes"
    labels:
      - "patch"
      - "fix"
      - "bugfix"
      - "bug"
  - title: "🧰 Maintenance"
    labels:
      - "chore"
      - "dependencies"
      - "ci"
      - "github-actions"
      - "docker"
      - "python"
  - title: "📚 Documentation"
    labels:
      - "documentation"
      - "docs"

# Autolabeler inspects each PR's title (and branch name, as a fallback)
#   feat: add support for X        -> labeled "minor"
#   fix: correct Y calculation     -> labeled "patch"
#   breaking: change config format -> labeled "major"
# Falls back to Dependabot's own commit-message prefixes too, so those
# PRs land in "Maintenance" automatically.
autolabeler:
  - label: "major"
    title:
      - "/^breaking(\\(.*\\))?!?:/i"
      - "/^feat(\\(.*\\))?!:/i"
    body:
      - "/BREAKING CHANGE/i"
  - label: "minor"
    title:
      - "/^feat(\\(.*\\))?:/i"
  - label: "patch"
    title:
      - "/^fix(\\(.*\\))?:/i"
      - "/^perf(\\(.*\\))?:/i"
  - label: "documentation"
    title:
      - "/^docs(\\(.*\\))?:/i"
  - label: "chore"
    title:
      - "/^chore(\\(.*\\))?:/i"
      - "/^ci(\\(.*\\))?:/i"
      - "/^refactor(\\(.*\\))?:/i"
      - "/^test(\\(.*\\))?:/i"

# Decides how the next version number is computed from whichever
# labels are present on PRs merged since the last release.
# Highest severity wins: any "major" label -> bump major version, else
# any "minor"/"feature" -> bump minor, else default to a patch bump.
version-resolver:
  major:
    labels:
      - "major"
      - "breaking"
  minor:
    labels:
      - "minor"
      - "feature"
      - "enhancement"
  patch:
    labels:
      - "patch"
      - "fix"
      - "bugfix"
      - "bug"
      - "chore"
      - "dependencies"
      - "documentation"
  default: patch

exclude-labels:
  - "skip-changelog"

template: |
  ## Changes

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
