#pip install build twine
#python -m build
#python -m twine upload dist/*

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-protocol-gateway"
version = "1.1.10"
description = "Reads live register data from Modbus RTU/TCP, CAN bus, and proprietary serial protocols, then fans that data out to any combination of MQTT brokers, TimescaleDB, InfluxDB, and JSON outputs — all managed through a built-in web administration UI."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "BuxtonCalvin", email = "buxtoncalvin@gmail.com" }]
requires-python = ">=3.10"
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
protocol-gateway = "protocol_gateway:main"
mpg = "protocol_gateway:main"

[tool.setuptools]
py-modules = ["protocol_gateway"]
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
optional-dependencies = {dev = { file = ["requirements-dev.txt"] }}

[project.urls]
Homepage = "https://github.com/BuxtonCalvin/MultiProtocolGateway"
Repository = "https://github.com/BuxtonCalvin/MultiProtocolGateway"
