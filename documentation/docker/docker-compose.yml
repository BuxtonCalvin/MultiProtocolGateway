# Description: Multi Protocol Gateway — Full Monitoring Stack
# File: docker-compose.yml
# =============================================================================
# Multi Protocol Gateway — Full Monitoring Stack
# =============================================================================
#
# Services included:
#   mpg            - Multi Protocol Gateway (web UI on :1717)
#   timescaledb    - TimescaleDB / PostgreSQL (:5432)
#   influxdb       - InfluxDB v1.x (:8086)
#   influxdb3      - InfluxDB v3.x (:8181)
#   influxdb3-explorer - influxdb3-explorer v1.8 (8888)
#   mosquitto      - Eclipse Mosquitto MQTT broker (:1883, :9001 websocket)
#   pgadmin        - pgAdmin 4 web UI (:5050)
#   chronograf     - InfluxDB web dashboard (:8888)
#   grafana        - Grafana visualization (:3000)
#   portainer       - Portainer Docker management (:9000)
#
# Usage:
#   1. Copy this file and the companion configs to your docker compose deployment directory:
#        cp docker-compose.yml /opt/mpg/docker-compose.yml
#
#   2. Create the .env file from the example and set your passwords:
#        cp .env.example .env && nano .env
#
#   3. Create required config directories:
#        mkdir -p config/mosquitto/{config,data,log}
#        mkdir -p config/grafana/provisioning/{datasources,dashboards}
#
#   4. Drop your mosquitto.conf into config/mosquitto/config/
#      (see the mosquitto.conf example block at the bottom of this file)
#
#   5. Start the stack:
#        docker compose up -d
#
#   6. Open the MPG web UI at http://localhost:1717 to configure your devices.
#
# Notes:
#   - MPG requires access to a serial/USB device for Modbus RTU if
#     you're accessing data via a serial connection.
#     Add your device path under the `devices:` key in the mpg service.
#     Other wise, you need to provide access to a tcp-to-serial bridge device.
#     For Modbus TCP only, remove the `devices:` section entirely.
#   - All persistent data is stored in named Docker volumes by default.
#     Override VOLUME_BASE in .env to store data on the host filesystem.
#   - Grafana is pre-configured to discover TimescaleDB and InfluxDB
#     as data sources on first boot via provisioning files.
# =============================================================================

x-restart-policy: &restart-policy
  restart: unless-stopped

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  mpg_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.17.0.0/24

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # Multi Protocol Gateway
  # ---------------------------------------------------------------------------
  mpg:
    image: buxtoncalvin/multiprotocolgateway:latest
    container_name: mpg
    <<: [*restart-policy, *default-logging]
    ports:
      - "${MPG_PORT:-1717}:1717"
    volumes:
      - mpg/mpg_config:/app/config
      - mpg/mpg_protocols:/app/protocols
      # if you want to persist the backlog and logs, uncomment these lines 
      #- mpg/backlogs:/app/backlogs
      #- mpg/logs:/app/logs      
      # Mount your config.cfg directly if you manage it outside the UI:
      # - mpg/config/config.cfg:/app/config/config.cfg
    environment:
      TZ: ${TZ:-UTC}
    # Uncomment and set the correct device path for Modbus RTU / serial:
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    #   - /dev/ttyACM0:/dev/ttyACM0
    networks:
      - mpg_internal
    # Uncomment each bridge that you use.
    # depends_on:
    #   timescaledb:
    #     condition: service_healthy
    #   influxdb:
    #     condition: service_healthy
    #   mosquitto:
    #     condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1717/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # TimescaleDB  (PostgreSQL ***with time-series hypertable extension and HA (High Availability) version***)
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb-ha:pg18
    container_name: timescaledb
    <<: [*restart-policy, *default-logging]
    ports:
      - "${TIMESCALE_PORT:-5432}:5432"
    volumes:
     # note the ha version of timescaledb uses a different data storage path compared to the standard postgres database
      - mpg/timescaledb/timescaledb_data:/var/lib/postgresql/data

    environment:
      POSTGRES_DB: ${TIMESCALE_DB:-mpg}
      POSTGRES_USER: ${TIMESCALE_USER:-mpg}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:?TIMESCALE_PASSWORD must be set in .env}
      TZ: ${TZ:-UTC}
    networks:
      - mpg_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-mpg} -d ${TIMESCALE_DB:-mpg}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # User either/or version 1.x or 3.x
  # ---------------------------------------------------------------------------
  # InfluxDB  (v1.x — compatible with MPG's influxdb_out transport)
  # ---------------------------------------------------------------------------
  influxdb:
    image: influxdb:1.8.0
    container_name: influxdb1_8
    <<: [*restart-policy, *default-logging]
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    volumes:
      - mpg/influxdb/influxdb_data:/var/lib/influxdb
      - mpg/influxdb/influxdb_config:/etc/influxdb
    environment:
      INFLUXDB_DB: ${INFLUXDB_DB:-mpg}
      INFLUXDB_ADMIN_USER: ${INFLUXDB_ADMIN_USER:-admin}
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:?INFLUXDB_ADMIN_PASSWORD must be set in .env}
      INFLUXDB_USER: ${INFLUXDB_USER:-mpg}
      INFLUXDB_USER_PASSWORD: ${INFLUXDB_USER_PASSWORD:?INFLUXDB_USER_PASSWORD must be set in .env}
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
      TZ: ${TZ:-UTC}
    networks:
      - mpg_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # InfluxDB  (v3.x — compatible with MPG's influxdb_out transport)
  # ---------------------------------------------------------------------------
  influxdb3:
    image: influxdb:3-core
    container_name: influxdb_v3
    <<: [*restart-policy, *default-logging]
    ports:
      - "8181:8181" # Native v3 API port
    volumes:
      - mpg/influxdb3/influxdb3_data:/var/lib/influxdb3/data
    networks:
      - mpg_internal      
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --cluster-id=cluster0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
  
  # Only if using influxdb3 -- influxdb3 configuration ui tool
  explorer:
    # explicit consistent stable version is 1.8.0
    image: influxdata/influxdb3-ui:1.8.0
    container_name: influxdb3-explorer
    <<: [*restart-policy, *default-logging]
    ports:
      - "8888:8080"
    volumes:
      - mpg/influxdb3/db:/db:rw
      # set the params for influxdb3 in the config.json file
      - mpg/influxdb3/config:/app-root/config:ro
    environment:
      - SESSION_SECRET_KEY=${INFLUXDB_SESSION_SECRET_KEY:?INFLUXDB_SESSION_SECRET_KEY must be set in .env}
    command:
      - --mode=admin      
    networks:
      - mpg_internal            


  # ---------------------------------------------------------------------------
  # Eclipse Mosquitto  (MQTT broker)
  # Port 1883 = standard MQTT
  # Port 9001 = MQTT over WebSocket (for browser-based clients / Home Assistant)
  # ---------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    <<: [*restart-policy, *default-logging]
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - mpg/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mpg/mosquitto/mosquitto_data:/mosquitto/data
      - mpg/mosquitto/mosquitto_log:/mosquitto/log
    environment:
      TZ: ${TZ:-UTC}
    networks:
      - mpg_internal
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "ping", "-q", "0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # pgAdmin 4  (PostgreSQL / TimescaleDB web management)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    <<: [*restart-policy, *default-logging]
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - mpg/pgadmin/pgadmin_data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL must be set in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set in .env}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      TZ: ${TZ:-UTC}
    networks:
      - mpg_internal
    depends_on:
      timescaledb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Chronograf  (InfluxDB 1.x web dashboard)  
  # ---------------------------------------------------------------------------
  chronograf:
    image: chronograf:latest
    container_name: chronograf
    <<: [*restart-policy, *default-logging]
    ports:
      - "${CHRONOGRAF_PORT:-8888}:8888"
    volumes:
      - mpg/chronograf/chronograf_data:/var/lib/chronograf
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_USERNAME: ${INFLUXDB_ADMIN_USER:-admin}
      INFLUXDB_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:?INFLUXDB_ADMIN_PASSWORD must be set in .env}
      TZ: ${TZ:-UTC}
    networks:
      - mpg_internal
    depends_on:
      influxdb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Grafana  (unified visualization — connects to both TimescaleDB & InfluxDB)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: mpg_grafana
    <<: [*restart-policy, *default-logging]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - mpg/grafana/grafana_data:/var/lib/grafana
      - mpg/grafana/provisioning:/etc/grafana/provisioning:ro
      # Optional: mount pre-built dashboards
      # - mpg/grafana/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set in .env}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      # TimescaleDB connection (used by provisioned datasource)
      GF_TIMESCALE_HOST: timescaledb
      GF_TIMESCALE_PORT: "5432"
      GF_TIMESCALE_DB: ${TIMESCALE_DB:-mpg}
      GF_TIMESCALE_USER: ${TIMESCALE_USER:-mpg}
      GF_TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:?TIMESCALE_PASSWORD must be set in .env}
      # InfluxDB connection (used by provisioned datasource)
      GF_INFLUX_URL: http://influxdb:8086
      GF_INFLUX_DB: ${INFLUXDB_DB:-mpg}
      GF_INFLUX_USER: ${INFLUXDB_USER:-mpg}
      GF_INFLUX_PASSWORD: ${INFLUXDB_USER_PASSWORD:?INFLUXDB_USER_PASSWORD must be set in .env}
      TZ: ${TZ:-UTC}
    networks:
      - mpg_internal
    depends_on:
      timescaledb:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    <<: [*restart-policy, *default-logging]
    ports:
      - "9000:9000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - mpg/portainer_data:/data
    networks:
      - mpg_internal