{% extends "base.html" %}
{% block title %}View Log — MPG Admin{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto">
  <div class="flex items-center justify-between mb-4">
    <h1 class="surface-title font-bold text-xl">Gateway Log</h1>
    <div class="flex items-center gap-2">
      <label class="text-mpg-400 text-xs" for="log-lines">Lines:</label>
      <select id="log-lines"
              class="bg-mpg-800 border border-mpg-600 rounded px-2 py-1
                     text-mpg-200 text-xs focus:outline-none focus:ring-1 focus:ring-accent"
              hx-get="/api/log"
              hx-target="#log-content"
              hx-swap="innerHTML"
              hx-trigger="change"
              hx-include="#log-lines">
        <option value="100">100</option>
        <option value="250" selected>250</option>
        <option value="500">500</option>
        <option value="1000">1000</option>
      </select>
      <button class="btn-secondary text-xs"
              hx-get="/api/log?lines=250"
              hx-target="#log-content"
              hx-swap="innerHTML"
              aria-label="Refresh log">
        ↻ Refresh
      </button>
    </div>
  </div>

  <div id="log-content"
       class="bg-mpg-900 border border-mpg-700 rounded p-3
              font-mono text-xs text-mpg-300 overflow-y-auto
              max-h-[70vh] whitespace-pre-wrap leading-5"
       aria-label="Log output"
       aria-live="polite"
       hx-get="/api/log?lines=250"
       hx-trigger="load"
       hx-swap="innerHTML">
    <span class="text-mpg-500">Loading log…</span>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
  /* ── Colorize a single plain-text log line ── */
  function colorizeLine(line) {
    // HTML-escape first so log content cannot inject markup
    var s = line
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    return s
      // Timestamp
      .replace(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}[,.]\d{3})/,
        '<span class="log-timestamp">$1</span>')
      // Level badges — severity order matters
      .replace(/\[(ERROR|CRITICAL)\]/g,  '<span class="log-level-error">[$1]</span>')
      .replace(/\[(WARNING|WARN)\]/g,    '<span class="log-level-warning">[$1]</span>')
      .replace(/\[(INFO)\]/g,            '<span class="log-level-info">[$1]</span>')
      .replace(/\[(DEBUG)\]/g,           '<span class="log-level-debug">[$1]</span>')
      .replace(/\[(TRACE)\]/g,           '<span class="log-level-trace">[$1]</span>')
      // Logger / module name (dotted word after the level badge, before the colon)
      .replace(/(\])\s+([\w.]+):/,       '$1 <span class="log-logger">$2</span>:')
      // HTTP status codes — match uvicorn access log format: HTTP/x.x" NNN
      // and httpx/httpcore format: "HTTP/x.x NNN" or HTTP/x.x NNN OK
      .replace(
        /\bHTTP\/\d+\.\d+"? (2\d{2}|3\d{2}|4\d{2}|5\d{2})\b/g,
        function(match, code) {
          var cls = 'log-http-' + code[0] + 'xx';
          return match.replace(code, '<span class="' + cls + '">' + code + '</span>');
        }
      );
  }

  /* Convert a block of plain-text log lines to colorized HTML */
  function colorizeText(raw) {
    return raw.split('\n').map(colorizeLine).join('\n');
  }

  /* Rewrite the container's content as colorized HTML.
     Guards against re-entrance: skip if content is already colorized. */
  function applyColors(container) {
    // If the container already has colored spans, skip
    if (container.querySelector('.log-level-info, .log-level-debug, .log-level-error')) return;
    var raw = container.textContent || '';
    if (!raw.trim() || !/\d{4}-\d{2}-\d{2}/.test(raw)) return;
    container.innerHTML = colorizeText(raw);
  }

  document.addEventListener('DOMContentLoaded', function () {
    var container = document.getElementById('log-content');
    if (!container) return;

    // Watch for any child-list changes (HTMX innerHTML swaps replace all children)
    var observer = new MutationObserver(function (mutations) {
      // Disconnect briefly to avoid observing our own innerHTML rewrite
      observer.disconnect();
      applyColors(container);
      // Reconnect to catch future swaps
      observer.observe(container, { childList: true, subtree: false });
    });

    observer.observe(container, { childList: true, subtree: false });

    // Also colorize anything already present (e.g. SSR content)
    applyColors(container);
  });
})();
</script>
{% endblock %}
