# =============================================================================
# Mosquitto MQTT Broker Configuration
# Place this file at: config/mosquitto/config/mosquitto.conf
# =============================================================================

# ── MQTT Listener (standard port) ────────────────────────────────────────────
listener 1883
protocol mqtt

# ── WebSocket Listener (for browser clients and Home Assistant) ───────────────
listener 9001
protocol websockets

# ── Persistence ───────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ───────────────────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# ── Authentication ─────────────────────────────────────────────────────────────
# For anonymous access on a trusted local network (default for home lab use):
allow_anonymous true

# To require a username and password instead:
#   1. Generate a password file:
#        docker run --rm -it eclipse-mosquitto \
#          mosquitto_passwd -c /tmp/passwd <your_username>
#      Then copy /tmp/passwd to config/mosquitto/config/passwd
#   2. Comment out `allow_anonymous true` above and uncomment below:
#
# allow_anonymous false
# password_file /mosquitto/config/passwd

# ── Message size & queue limits ────────────────────────────────────────────────
max_packet_size 0
max_queued_messages 1000
message_size_limit 0
