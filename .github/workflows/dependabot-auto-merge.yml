name: Auto-merge dependency PRs

# Dependabot opens a PR -> this checks the update type -> if it's a
# safe (patch/minor) bump, GitHub's native auto-merge is enabled so the
# PR merges itself as soon as your required status checks
# (CI / CodeQL / Python version workflows, etc.) pass.
# Major version bumps are left alone for manual review.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2

      - name: Enable auto-merge for patch/minor updates
        # This checks that the PR does NOT contain a major version bump
        if: contains(steps.metadata.outputs.update-type, 'version-update:semver-major') == false
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label major version bumps for manual review
        if: contains(steps.metadata.outputs.update-type, 'version-update:semver-major')
        run: gh pr edit "$PR_URL" --add-label "needs-manual-review"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
