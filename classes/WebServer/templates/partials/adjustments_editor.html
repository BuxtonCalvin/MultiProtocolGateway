<!--
  adjustments_editor.html
  Loads the guided popup that opens when an Adjustments cell is clicked in the protocol editor.
  The popup is built by static/js/adjustments-editor.js (document-level event delegation, so it keeps
  working when HTMX swaps the register table).  Validation is done by the server
  (/api/protocols/adjustments/validate), which uses the same code the gateway loads maps with.
  The styles use only the permanently-dark chrome variables from mpg.css, like the JSON config editor.
-->
<style>
  .adj-panel { position: relative; width: 100%; max-width: 56rem; max-height: calc(100vh - 6rem); display: flex; flex-direction: column; }
  .adj-body { overflow-y: auto; padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 0.75rem; }
  .adj-footer { display: flex; justify-content: flex-end; gap: 0.5rem; padding: 0.75rem 1.25rem; border-top: 1px solid var(--mpg-700); }
  .adj-header-actions { display: flex; align-items: center; gap: 0.35rem; }
  .adj-help-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 1.5rem; height: 1.5rem; padding: 0; border: 1px solid var(--mpg-500); border-radius: 9999px; font-size: 0.8rem; font-weight: 700; line-height: 1; text-decoration: none; }
  .adj-help-btn:hover, .adj-help-btn:focus-visible { color: var(--mpg-accent); border-color: var(--mpg-accent); }
  .adj-title { color: var(--mpg-100); font-weight: 600; font-size: 0.95rem; }
  .adj-sub, .adj-hint, .adj-help { color: var(--mpg-300); font-size: 0.72rem; margin: 0.15rem 0 0; }
  .adj-help { font-size: 0.78rem; }
  .adj-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.75rem; color: var(--mpg-100); }
  .adj-cards { display: flex; flex-direction: column; gap: 0.6rem; }
  .adj-card { border: 1px solid var(--mpg-600); border-radius: 0.375rem; background: var(--mpg-900); padding: 0.65rem 0.8rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .adj-card-custom { border-style: dashed; }
  .adj-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
  .adj-empty { color: var(--mpg-300); font-size: 0.8rem; padding: 0.5rem 0; }
  .adj-input { width: 100%; border-radius: 0.25rem; padding: 0.25rem 0.5rem; font-size: 0.75rem; }
  .adj-field { display: flex; flex-direction: column; gap: 0.2rem; }
  .adj-field-inline { flex-direction: row; align-items: center; gap: 0.5rem; }
  .adj-label { color: var(--mpg-200); font-size: 0.72rem; }
  .adj-row { display: grid; gap: 0.4rem; align-items: center; }
  .adj-row-hl { grid-template-columns: 7rem 9rem 1fr 1.75rem; }
  .adj-row-case { grid-template-columns: 12rem 1fr 1.75rem; }
  .adj-row-range { grid-template-columns: 8rem 8rem; }
  .adj-row-preview { grid-template-columns: 8rem auto; justify-content: start; }
  .adj-colhead span { color: var(--mpg-300); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .adj-subhead { color: var(--mpg-200); font-size: 0.72rem; font-weight: 600; margin-top: 0.25rem; }
  .adj-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .adj-modes { display: flex; gap: 1rem; flex-wrap: wrap; color: var(--mpg-100); font-size: 0.75rem; }
  .adj-chips { display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .adj-chip { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.68rem; color: var(--mpg-accent); border: 1px solid var(--mpg-600); border-radius: 0.25rem; padding: 0.05rem 0.35rem; background: transparent; cursor: pointer; }
  .adj-chip:hover { border-color: var(--mpg-accent); }
  .adj-x { color: var(--mpg-400); font-weight: 700; line-height: 1; padding: 0.1rem 0.35rem; background: transparent; border: 0; cursor: pointer; }
  .adj-x:hover { color: var(--mpg-danger); }
  .adj-messages { display: flex; flex-direction: column; gap: 0.25rem; }
  .adj-msg { font-size: 0.75rem; margin: 0; padding: 0.3rem 0.6rem; border-radius: 0.25rem; border: 1px solid transparent; }
  .adj-err { color: #fca5a5; background: rgb(239 68 68 / 0.1); border-color: rgb(239 68 68 / 0.4); }
  .adj-warn { color: #fcd34d; background: rgb(245 158 11 / 0.1); border-color: rgb(245 158 11 / 0.4); }
  .adj-ok { color: #86efac; background: rgb(34 197 94 / 0.1); border-color: rgb(34 197 94 / 0.4); }
  .adj-info { color: #93c5fd; background: rgb(59 130 246 / 0.1); border-color: rgb(59 130 246 / 0.4); }
  .adj-muted { color: var(--mpg-300); }
  .adj-varbox { display: flex; flex-direction: column; gap: 0.35rem; }
  .adj-chip-ctx { color: #fcd34d; border-color: rgb(245 158 11 / 0.55); }
  .adj-chip-ctx:hover { border-color: #fcd34d; }
  .adj-preview summary, .adj-raw { color: var(--mpg-100); font-size: 0.78rem; }
  .adj-preview summary { cursor: pointer; margin-bottom: 0.4rem; }
  .adj-preview details > * { margin-top: 0.35rem; }
  .adj-result { color: var(--mpg-accent); }
  .adj-rawarea { min-height: 8rem; resize: vertical; margin-top: 0.5rem; }
  .adj-toast { position: fixed; right: 1rem; bottom: 1rem; z-index: 60; max-width: 28rem; color: #fca5a5; background: var(--mpg-800); border: 1px solid rgb(239 68 68 / 0.6); border-radius: 0.375rem; padding: 0.6rem 0.9rem; font-size: 0.8rem; box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.5); }
</style>
<script src="/static/js/adjustments-editor.js?v=1"></script>
