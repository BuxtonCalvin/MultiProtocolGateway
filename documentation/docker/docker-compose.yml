# Description: Multi Protocol Gateway — Full Monitoring Stack
# File: docker-compose.yml
# =============================================================================
# Multi Protocol Gateway — Full Monitoring Stack
# =============================================================================
#
# Services included:
#   mpg            - Multi Protocol Gateway (web UI on :1717; Prometheus
#                    metrics also on a dedicated :9110 port if you configure it in config.cfg)
#   timescaledb    - TimescaleDB / PostgreSQL (:5432)
#   influxdb       - InfluxDB v1.x (:8086)
#   influxdb3      - InfluxDB v3.x (host :8100 -> container :8181)
#   influxdb3-explorer - influxdb3-explorer v1.8 (host :8889/:8887/:8886)
#   mosquitto      - Eclipse Mosquitto MQTT broker (:1883, :9001 websocket)
#   pgadmin        - pgAdmin 4 web UI (:5050)
#   chronograf     - InfluxDB web dashboard (:8888)
#   grafana        - Grafana visualization (:3000)
#   prometheus     - Prometheus monitoring (:9090)
#   portainer      - Portainer Docker management (:9000)
#
# Usage:
#   1. Copy this file and the companion configs to your docker compose deployment directory:
#        cp docker-compose.yml /opt/mpg/docker-compose.yml
#        Then edit the file to suit your needs (Needed apps, ports, volumes, etc.)
#
#   2. Create the .env file from the example and set your passwords:
#        cp .env.example .env && nano .env
#
#   3. Create required config directories:
#        mkdir -p config/mosquitto/{config,data,log}
#        mkdir -p config/grafana/provisioning/{datasources,dashboards}
#        mkdir -p config/prometheus
#
#   4. Drop your mosquitto.conf into config/mosquitto/config/
#      (see the mosquitto.conf example block at the bottom of this file)
#
#   5. Drop prometheus.yml into config/prometheus/ (a starter file scraping
#      the mpg service on its metrics port is provided alongside this file —
#      see prometheus.yml). This file MUST exist before first "docker compose up",
#      or Docker will bind-mount an empty directory in its place and the
#      prometheus container will fail to start.
#
#   6. In your MPG config.cfg, add a Prometheus bridge section, e.g.:
#        [prometheus_output]
#        type = prometheus_out
#        metric_prefix = device_
#        metrics_path = /metrics
#        metrics_port = 9110
#      metrics_port is optional -- omit it and MPG serves /metrics on the
#      same port as the web UI (1717), nothing else to configure. This
#      compose file uses it anyway, as a segmentation example: the mpg
#      service below does NOT publish 9110 to the host, only 1717. That
#      means 9110 is reachable solely by other containers on the
#      mpg_internal network (i.e. the "prometheus" service here) -- not
#      from outside Docker -- while 1717 (which can edit device config)
#      stays the one port you actually expose. This is one process, one
#      web server; metrics_port is just an additional restricted socket
#      on it, not a second server (see classes/WebServer/main.py).
#
#
#   7. Start the stack:
#        docker compose up -d
#
#   8. Open the MPG web UI at http://localhost:1717 to configure your devices.
#      Open the Prometheus UI at http://localhost:9090 to confirm the "mpg"
#      target under Status -> Targets shows as UP.
#
# Notes:
#   - MPG requires access to a serial/USB device for Modbus RTU if
#     you're accessing data via a serial connection.
#     Add your device path under the `devices:` key in the mpg service.
#     Other wise, you need to provide access to a tcp-to-serial bridge device.
#     For Modbus TCP only, remove the `devices:` section entirely.
#   - All persistent data is stored in named Docker volumes by default.
#     Override VOLUME_BASE in .env to store data on the host filesystem.
#   - Grafana is pre-configured to discover TimescaleDB and InfluxDB
#     as data sources on first boot via provisioning files.
#   - influxdb3 / influxdb3-explorer host ports intentionally differ from
#     their container-internal ports (8100->8181, 8889/8887/8886->80/443/8080).
#     Use the HOST-side port when connecting from outside Docker.
# =============================================================================

x-restart-policy: &restart-policy
  restart: unless-stopped

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  mpg_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.17.0.0/24

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # Multi Protocol Gateway
  # ---------------------------------------------------------------------------
  mpg:
    image: buxtoncalvin/multiprotocolgateway:latest
    container_name: mpg
    <<: [*restart-policy, *default-logging]
    ports:
      - "${MPG_PORT:-1717}:1717"
      # /metrics is always reachable here 1717 too. 
      
      # - "9110:9110"
      # add "9110:9110" here for Prometheus metrics to be reachable from the host,
      # but it's not required for Prometheus to scrape it from the internal network.
      #  Only add this line if you specifically want it reachable from the host too.

    volumes:
      - mpg/mpg_config:/app/config
      - mpg/mpg_protocols:/app/protocols
      # if you want to persist the backlog and logs, uncomment these lines
      #- mpg/backlogs:/app/backlogs
      #- mpg/logs:/app/logs
      # Mount your config.cfg directly if you manage it outside the UI:
      # - mpg/config/config.cfg:/app/config/config.cfg
    environment:
      TZ: ${TZ:-UTC}
    # Uncomment and set the correct device path for Modbus RTU / serial:
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    #   - /dev/ttyACM0:/dev/ttyACM0
    networks:
      - mpg_internal
    # Uncomment each bridge that you use.
    # depends_on:
    #   timescaledb:
    #     condition: service_healthy
    #   influxdb:
    #     condition: service_healthy
    #   mosquitto:
    #     condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1717/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # TimescaleDB  (PostgreSQL ***with time-series hypertable extension and HA (High Availability) version***)
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb-ha:pg18
    container_name: timescaledb
    <<: [*restart-policy, *default-logging]
    ports:
      - "${TIMESCALE_PORT:-5432}:5432"
    volumes:
      # note the ha version of timescaledb uses a different data storage path compared to the standard postgres database
      - mpg/timescaledb/timescaledb_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${TIMESCALE_DB:-mpg}
      POSTGRES_USER: ${TIMESCALE_USER:-mpg}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:?TIMESCALE_PASSWORD must be set in .env}
      TZ: ${TZ:-UTC}
    networks:
      - mpg_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-mpg} -d ${TIMESCALE_DB:-mpg}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # User either/or version 1.x or 3.x
  # ---------------------------------------------------------------------------
  # InfluxDB  (v1.x — compatible with MPG's influxdb_out transport)
  # ---------------------------------------------------------------------------
  influxdb:
    image: influxdb:1.8.0
    container_name: influxdb1_8
    <<: [*restart-policy, *default-logging]
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    volumes:
      - mpg/influxdb/influxdb_data:/var/lib/influxdb
      - mpg/influxdb/influxdb_config:/etc/influxdb
    environment:
      INFLUXDB_DB: ${INFLUXDB_DB:-mpg}
      INFLUXDB_ADMIN_USER: ${INFLUXDB_ADMIN_USER:-admin}
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:?INFLUXDB_ADMIN_PASSWORD must be set in .env}
      INFLUXDB_USER: ${INFLUXDB_USER:-mpg}
      INFLUXDB_USER_PASSWORD: ${INFLUXDB_USER_PASSWORD:?INFLUXDB_USER_PASSWORD must be set in .env}
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
      TZ: ${TZ:-UTC}
    networks:
      - mpg_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # InfluxDB  (v3.x — compatible with MPG's influxdb3_out transport)
  # ---------------------------------------------------------------------------
  influxdb3:
    image: influxdb:3-core
    container_name: influxdb_v3-core
    <<: [*restart-policy, *default-logging]
    user: root
    environment:
      # This env tells the engine process which token string matches the operational layer.
      # FIX: do not hardcode a real token in a shared compose file — generate your own and
      # put it in .env instead (see .env.example: INFLUXDB3_AUTH_TOKEN=...).
      - INFLUXDB3_AUTH_TOKEN=${INFLUXDB3_AUTH_TOKEN:?INFLUXDB3_AUTH_TOKEN must be set in .env}
    ports:
      - "8100:8181" # Host 8100 -> container 8181 (native v3 API port)
    volumes:
      - mpg/influxdb3/data:/var/lib/influxdb3/data:z
      - mpg/influxdb3/influxdb3_plugins:/var/lib/influxdb3/plugins
      #- mpg/influxdb3/certs:/etc/ssl/influxdb:ro    # Mounts your host certs folder into the container
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
      - --disable-authz=health,ping
      - --admin-token-file=/var/lib/influxdb3/data/admin_token.json
      #- --tls-cert=/etc/ssl/influxdb/server-cert.pem
      #- --tls-key=/etc/ssl/influxdb/server-key.key
    networks:
      - mpg_internal

  # Only if using influxdb3 -- influxdb3 configuration ui tool
  influxdb3-explorer:
    image: influxdata/influxdb3-ui:latest
    container_name: influxdb3-explorer
    <<: [*restart-policy, *default-logging]
    user: root
    ports:
      - "8889:80"
      - "8887:443"
      - "8886:8080"
    environment:
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:?SESSION_SECRET_KEY must be set in .env}
    command: ["--mode=admin"]
    networks:
      - mpg_internal

  # ---------------------------------------------------------------------------
  # Eclipse Mosquitto  (MQTT broker)
  # Port 1883 = standard MQTT
  # Port 9001 = MQTT over WebSocket (for browser-based clients / Home Assistant)
  # ---------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    <<: [*restart-policy, *default-logging]
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - mpg/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mpg/mosquitto/mosquitto_data:/mosquitto/data
      - mpg/mosquitto/mosquitto_log:/mosquitto/log
    environment:
      TZ: ${TZ:-UTC}
    networks:
      - mpg_internal
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "ping", "-q", "0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # pgAdmin 4  (PostgreSQL / TimescaleDB web management)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    <<: [*restart-policy, *default-logging]
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - mpg/pgadmin/pgadmin_data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL must be set in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set in .env}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      TZ: ${TZ:-UTC}
    networks:
      - mpg_internal
    depends_on:
      timescaledb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Chronograf  (InfluxDB 1.x web dashboard)
  # ---------------------------------------------------------------------------
  chronograf:
    image: chronograf:latest
    container_name: chronograf
    <<: [*restart-policy, *default-logging]
    ports:
      - "${CHRONOGRAF_PORT:-8888}:8888"
    volumes:
      - mpg/chronograf/chronograf_data:/var/lib/chronograf
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_USERNAME: ${INFLUXDB_ADMIN_USER:-admin}
      INFLUXDB_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:?INFLUXDB_ADMIN_PASSWORD must be set in .env}
      TZ: ${TZ:-UTC}
    networks:
      - mpg_internal
    depends_on:
      influxdb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Grafana  (unified visualization — connects to both TimescaleDB & InfluxDB)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: mpg_grafana
    <<: [*restart-policy, *default-logging]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - mpg/grafana/grafana_data:/var/lib/grafana
      - mpg/grafana/provisioning:/etc/grafana/provisioning:ro
      # Optional: mount pre-built dashboards
      # - mpg/grafana/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set in .env}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      # TimescaleDB connection (used by provisioned datasource)
      GF_TIMESCALE_HOST: timescaledb
      GF_TIMESCALE_PORT: "5432"
      GF_TIMESCALE_DB: ${TIMESCALE_DB:-mpg}
      GF_TIMESCALE_USER: ${TIMESCALE_USER:-mpg}
      GF_TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:?TIMESCALE_PASSWORD must be set in .env}
      # InfluxDB connection (used by provisioned datasource)
      GF_INFLUX_URL: http://influxdb:8086
      GF_INFLUX_DB: ${INFLUXDB_DB:-mpg}
      GF_INFLUX_USER: ${INFLUXDB_USER:-mpg}
      GF_INFLUX_PASSWORD: ${INFLUXDB_USER_PASSWORD:?INFLUXDB_USER_PASSWORD must be set in .env}
      TZ: ${TZ:-UTC}
    networks:
      - mpg_internal
    depends_on:
      timescaledb:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Prometheus  (scrapes MPG's prometheus_out bridge — see prometheus.yml)
  # ---------------------------------------------------------------------------
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    <<: [*restart-policy, *default-logging]
    volumes:
      # FIX: dropped the docker.sock bind-mount and `user: root` — this stack's
      # prometheus.yml uses static_configs, not docker_sd_configs, so Prometheus
      # never needs Docker API / socket access. Add both back only if you
      # switch to Docker service discovery.
      - mpg/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - mpg/prometheus/prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=promql-experimental-functions'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    # FIX: removed the redundant `expose: [9090]` — already published above,
    # and containers on mpg_internal can reach each other regardless of
    # "expose"/"ports" either way.
    networks:
      - mpg_internal
    # FIX: added — not strictly required (Prometheus retries scrape targets
    # on its own schedule regardless of startup order) but avoids a burst
    # of "connection refused" scrape errors on first boot.
    depends_on:
      mpg:
        condition: service_healthy

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    <<: [*restart-policy, *default-logging]
    ports:
      - "9000:9000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - mpg/portainer_data:/data
    networks:
      - mpg_internal
