name: Publish Docker Image

on:
  push:
    branches:
      - main
      - Test
      - v1/*  # Matches any branch starting with v1
  workflow_dispatch: 

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get current date for tag
        id: date
        run: echo "NOW=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        id: get_branch

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERTOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            # Tag with branch name
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ steps.get_branch.outputs.branch }}
            # Tag with branch name and date
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ steps.get_branch.outputs.branch }}-${{ steps.date.outputs.NOW }}
            # Tag with 'latest' ONLY if the branch is main
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}:latest', secrets.DOCKER_USERNAME, github.event.repository.name) || '' }}